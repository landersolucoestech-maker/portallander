name: Frontend CI and Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify canonical dev ref
        run: |
          test "${GITHUB_REF_NAME}" = "dev"
          test "$(git branch --show-current)" = "dev"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install monorepo
        run: npm ci
      - name: Lint web
        run: npm run lint
      - name: Architecture boundaries
        run: npm run check:architecture
      - name: Typecheck web
        run: npm run typecheck
      - name: Unit tests web
        run: npm test
      - name: Validate API syntax
        run: npm --workspace @portallander/api run build
      - name: Unit tests API
        run: npm --workspace @portallander/api test

  build:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install monorepo
        run: npm ci
      - name: Production build without demo data
        env:
          VITE_ENABLE_DEMO_DATA: ''
          VITE_MOCKUP_SCENARIO: ''
        run: npm run build
      - name: Prove production mockup runtime references are zero
        run: |
          if grep -R -E "@portallander/mockup|mockup/full|mockup:source:|mockup:candidate:|generatedRuntimeData|mockCurrentUserId" apps/web/dist >/tmp/mockup-production-hits.txt; then
            cat /tmp/mockup-production-hits.txt
            echo "PRODUCTION MOCKUP REFERENCES != 0"
            exit 1
          fi
          echo "PRODUCTION MOCKUP REFERENCES = 0"
          echo "PRODUCTION MOCK DATA FALLBACK = 0"
      - name: Build Pages development demo
        env:
          VITE_ENABLE_DEMO_DATA: 'true'
          VITE_MOCKUP_SCENARIO: 'full'
        run: npm run build
      - name: Prove full mockup is present in development artifact
        run: |
          grep -R "mockup:source:mbw" apps/web/dist >/dev/null
          grep -R "content_mock_009" apps/web/dist >/dev/null
          grep -R "mockup:analytics:instagram:followers" apps/web/dist >/dev/null
          grep -R "mockup:account:instagram:portal-lander" apps/web/dist >/dev/null
          echo "DEVELOPMENT MOCKUP SCENARIO = full"
          echo "FULL MOCKUP LOADED = YES"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  visual-audit:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install monorepo
        run: npm ci
      - name: Build explicit browser demo fixture
        env:
          VITE_ENABLE_DEMO_DATA: 'true'
          VITE_MOCKUP_SCENARIO: 'full'
        run: npm run build
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm --workspace @portallander/web run preview -- --host 127.0.0.1 > /tmp/portal-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/portallander/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portal-preview.log
          exit 1
      - name: Visual regression audit
        run: npm --workspace @portallander/web run test:visual
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-visual-audit
          path: apps/web/test-results/visual
          if-no-files-found: warn

  deploy:
    if: github.ref_name == 'dev'
    environment:
      name: pages-dev
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deployed-browser-smoke:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    needs: deploy
    env:
      DEPLOY_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install monorepo
        run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Validate published development URL in Chromium
        working-directory: apps/web
        run: |
          mkdir -p test-results/deployed
          node --input-type=module <<'NODE'
          import {chromium} from '@playwright/test'

          const base=process.env.DEPLOY_URL
          if(!base)throw new Error('DEPLOY_URL was not provided by deploy-pages.')
          const browser=await chromium.launch({headless:true})
          const page=await browser.newPage({viewport:{width:1440,height:1000}})
          const pageErrors=[]
          let metricsInstagramFollowers=''
          let mediaKitEditorFollowers=''
          page.on('pageerror',error=>pageErrors.push(error.message))

          const normalizedMetricNumber=value=>{
            const raw=String(value??'').trim().toLowerCase().replace(/\s+/g,' ')
            if(!raw||raw.includes('indisponível')||raw.includes('carregando'))return null
            const multiplier=raw.includes('mil')?1_000:raw.includes('mi')?1_000_000:1
            const numeric=raw.replace(/mil|mi/g,'').replace(/r\$/g,'').replace(/%/g,'').trim()
            const canonical=multiplier===1?numeric.replace(/\./g,'').replace(',','.'):numeric.replace(/\./g,'').replace(',','.')
            const parsed=Number(canonical)
            return Number.isFinite(parsed)?parsed*multiplier:null
          }
          async function stableSurface(){
            await page.locator('main').first().waitFor({state:'visible',timeout:15000})
          }
          async function visit(hash,fileName,verify=stableSurface){
            const url=`${base}${hash}`
            const response=await page.goto(url,{waitUntil:'domcontentloaded'})
            if(response&&!response.ok())throw new Error(`HTTP ${response.status()} for ${url}`)
            console.log(response?`DEPLOY_HTTP ${response.status()} ${url}`:`DEPLOY_HTTP SAME_DOCUMENT ${url}`)
            try{
              await verify()
              await page.screenshot({path:`test-results/deployed/${fileName}`,fullPage:true})
              console.log(`DEPLOY_BROWSER_PASS ${url}`)
            }catch(error){
              const body=(await page.locator('body').innerText()).slice(0,7000)
              console.log(`DEPLOY_BODY ${JSON.stringify(body)}`)
              await page.screenshot({path:`test-results/deployed/diagnostic-${fileName}`,fullPage:true})
              throw error
            }
          }
          async function canonicalFormsCount(){
            const rows=page.locator('.site-forms-table tbody tr')
            await rows.first().waitFor({state:'visible',timeout:15000})
            const count=await rows.count()
            if(count!==2)throw new Error(`ADMIN SYSTEM FORM COUNT ${count} != 2`)
            const body=await page.locator('.site-forms-table').innerText()
            if(!body.includes('Contato Comercial')||!body.includes('Colabore / Anuncie'))throw new Error('Canonical system form names are missing.')
            if(body.includes('Captação de Leads')||body.includes('Contato Comercial · Anuncie'))throw new Error('Legacy system form still appears as an administrative row.')
            if(!body.includes('CRM → Leads')||!body.includes('Site → Conteúdos → Colaborações recebidas'))throw new Error('Canonical form destinations are missing.')
            return count
          }
          async function assertSocialSource(tabName,testId){
            await page.getByRole('tab',{name:tabName,exact:true}).click()
            const source=page.getByTestId(testId)
            await source.waitFor({state:'visible',timeout:15000})
            await source.getByText(`Resumo · ${tabName}`,{exact:true}).waitFor({state:'visible',timeout:15000})
            const body=await source.innerText()
            for(const forbidden of ['Metric key','Account ID','Property ID','Scope'])if(body.includes(forbidden))throw new Error(`${tabName} still exposes technical manual field: ${forbidden}`)
            const followers=source.locator('.marketing-metric-strip article').filter({hasText:'Seguidores'}).first()
            await followers.waitFor({state:'visible',timeout:15000})
            const value=(await followers.locator('strong').innerText()).trim()
            if(normalizedMetricNumber(value)===null)throw new Error(`${tabName} followers not populated in development full: ${value}`)
            return value
          }

          try{
            await visit('','01-home.png',async()=>{
              await page.locator('main[aria-label="Seções da Página Inicial"]').waitFor({state:'visible',timeout:15000})
              await page.getByRole('region',{name:'Em Destaque'}).waitFor({state:'visible',timeout:15000})
              if((await page.locator('body').innerText()).includes('Dados operacionais indisponíveis.'))throw new Error('Development Pages rendered production fail-closed screen.')
            })
            await visit('#/app/login','02-dashboard.png',async()=>{
              await page.waitForURL(/#\/app\/dashboard/,{timeout:15000})
              await page.getByText('Dashboard',{exact:true}).first().waitFor({state:'visible',timeout:15000})
            })
            await visit('#/app/crm','03-crm.png')
            await visit('#/app/finance','04-finance.png')
            await visit('#/app/agenda','05-agenda.png')
            await visit('#/app/chat','06-chat.png')
            await visit('#/app/rh','07-rh.png')
            await visit('#/app/marketing','08-marketing.png')
            await visit('#/app/metricas','09-metrics-global.png',async()=>{
              await page.getByTestId('metrics-page').waitFor({state:'visible',timeout:15000})
              const nav=page.getByRole('navigation',{name:'Módulos da Administração'})
              await nav.getByRole('link',{name:'Métricas',exact:true}).waitFor({state:'visible',timeout:15000})
              const marketingGroup=nav.locator('.sidebar-nav-group').filter({hasText:'Marketing'})
              const marketingButton=marketingGroup.getByRole('button',{name:/Marketing/})
              if((await marketingButton.getAttribute('aria-expanded'))!=='true')await marketingButton.click()
              if(await marketingGroup.getByRole('link',{name:'Métricas',exact:true}).count())throw new Error('Marketing still owns Metrics as submenu.')
              const tablist=page.getByRole('tablist',{name:'Fontes de Métricas'})
              const tabs=tablist.getByRole('tab')
              if(await tabs.count()!==5)throw new Error(`Metrics tab count ${(await tabs.count())} != 5`)
              const labels=(await tabs.allInnerTexts()).map(value=>value.trim())
              const expected=['Visão Geral','Site','Instagram','TikTok','YouTube']
              if(JSON.stringify(labels)!==JSON.stringify(expected))throw new Error(`Unexpected Metrics tabs: ${JSON.stringify(labels)}`)
              for(const legacy of ['Redes Sociais','Conteúdo','Conversões'])if(await tablist.getByRole('tab',{name:legacy,exact:true}).count())throw new Error(`Legacy Metrics tab still present: ${legacy}`)
              const period=page.getByLabel('Período global das métricas')
              await period.selectOption('7d')
              await page.getByRole('tab',{name:'Site',exact:true}).click()
              const site=page.getByTestId('metrics-site-tab')
              await site.waitFor({state:'visible',timeout:15000})
              const siteBody=await site.innerText()
              for(const label of ['Usuários','Novos usuários','Usuários recorrentes','Sessões','Visualizações','Views / usuário','Taxa de engajamento','Tempo médio','Canais de aquisição','Páginas mais acessadas'])if(!siteBody.includes(label))throw new Error(`Site metric missing from development full: ${label}`)
              const content=page.getByTestId('metrics-site-content')
              const conversions=page.getByTestId('metrics-site-conversions')
              await content.waitFor({state:'visible',timeout:15000})
              await conversions.waitFor({state:'visible',timeout:15000})
              const contentBody=await content.innerText()
              const conversionBody=await conversions.innerText()
              for(const label of ['Publicados','Rascunhos','Arquivados','Top Conteúdos'])if(!contentBody.includes(label))throw new Error(`Editorial metric missing inside Site: ${label}`)
              for(const label of ['Contato Comercial','Colabore','Anuncie','CRM','content_collaborations'])if(!conversionBody.includes(label))throw new Error(`Conversion context missing inside Site: ${label}`)
              if(await period.inputValue()!=='7d')throw new Error('Global Metrics period was not preserved on Site.')
              metricsInstagramFollowers=await assertSocialSource('Instagram','metrics-instagram-tab')
              if(await period.inputValue()!=='7d')throw new Error('Global Metrics period was not preserved on Instagram.')
              await assertSocialSource('TikTok','metrics-tiktok-tab')
              if(await period.inputValue()!=='7d')throw new Error('Global Metrics period was not preserved on TikTok.')
              await assertSocialSource('YouTube','metrics-youtube-tab')
              if(await period.inputValue()!=='7d')throw new Error('Global Metrics period was not preserved on YouTube.')
              await page.getByRole('tab',{name:'Visão Geral',exact:true}).click()
              if(await period.inputValue()!=='7d')throw new Error('Global Metrics period was not preserved after cycling all sources.')
              console.log('PAGES_GLOBAL_METRICS=PASS')
              console.log('PAGES_METRICS_SOURCE_TABS=PASS')
              console.log('PAGES_METRICS_SHARED_PERIOD=PASS')
            })
            await visit('#/app/marketing/metricas?tab=site','09b-metrics-legacy-redirect.png',async()=>{
              await page.waitForURL(/#\/app\/metricas\?tab=site$/,{timeout:15000})
              await page.getByTestId('metrics-site-tab').waitFor({state:'visible',timeout:15000})
              console.log('PAGES_METRICS_LEGACY_REDIRECT=PASS')
            })
            await visit('#/app/metricas?tab=banana','09c-metrics-invalid-tab.png',async()=>{
              const overview=page.getByRole('tab',{name:'Visão Geral',exact:true})
              await overview.waitFor({state:'visible',timeout:15000})
              if((await overview.getAttribute('aria-selected'))!=='true')throw new Error('Invalid Metrics tab did not fall back to Visão Geral.')
              console.log('PAGES_METRICS_INVALID_TAB_DEFAULT=PASS')
            })
            await visit('#/app/settings','10-settings.png')
            await visit('#/app/settings','11-integrations.png',async()=>{
              await page.getByRole('tab',{name:'Integrações',exact:true}).click()
              await page.getByRole('heading',{name:'Descoberta editorial',exact:true}).waitFor({state:'visible',timeout:15000})
              await page.getByText('Music Business Worldwide',{exact:true}).first().waitFor({state:'visible',timeout:15000})
              const body=await page.locator('body').innerText()
              for(const source of ['Music Business Worldwide','Billboard','Billboard Brasil','GDELT','YouTube','ECAD','Pro-Música Brasil','UBC','ABRAMUS','IFPI'])if(!body.includes(source))throw new Error(`Mockup source not visible: ${source}`)
              if(body.includes('Falha HTTP 404'))throw new Error('Editorial integrations still depend on unavailable Pages API.')
            })
            await visit('#/app/site/conteudos','12-site-contents.png',async()=>{
              await stableSurface()
              await page.getByText('Candidatos editoriais',{exact:false}).first().waitFor({state:'visible',timeout:15000})
            })
            await visit('#/app/site/conteudos','13-candidates.png')
            await visit('#/app/site/conteudos/content_mock_009','14-content-editor.png')
            await visit('#/app/site/midia','15-media.png')
            await visit('#/app/site/formularios','16-forms.png',async()=>{
              const initial=await canonicalFormsCount()
              console.log(`ADMIN SYSTEM FORM COUNT INITIAL = ${initial}`)
              await page.reload({waitUntil:'domcontentloaded'})
              const refreshed=await canonicalFormsCount()
              console.log(`ADMIN SYSTEM FORM COUNT REFRESH = ${refreshed}`)
              await page.goto(`${base}#/app/dashboard`,{waitUntil:'domcontentloaded'})
              await page.getByText('Dashboard',{exact:true}).first().waitFor({state:'visible',timeout:15000})
              await page.goto(`${base}#/app/site/formularios`,{waitUntil:'domcontentloaded'})
              const renavigated=await canonicalFormsCount()
              console.log(`ADMIN SYSTEM FORM COUNT RENAVIGATION = ${renavigated}`)
              if(initial!==2||refreshed!==2||renavigated!==2)throw new Error('Canonical form count was not stable across refresh/renavigation.')
              console.log('PAGES_CANONICAL_FORMS=PASS')
            })
            await visit('#/contato','17-public-contato.png',async()=>{
              await page.locator('.site-form-runtime-lead_capture').waitFor({state:'visible',timeout:15000})
              if(await page.locator('.pl-contact-form').count())throw new Error('/contato still renders legacy mailto intake form.')
              console.log('PAGES_CONTACT_CANONICAL_FORM=PASS')
            })
            await visit('#/colabore','18-public-colabore.png',async()=>{
              await page.locator('.site-form-runtime-editorial_submission').waitFor({state:'visible',timeout:15000})
              console.log('PAGES_COLABORE_CANONICAL_FORM=PASS')
            })
            await visit('#/anuncie','19-public-anuncie.png',async()=>{
              await page.locator('.site-form-runtime-editorial_submission').waitFor({state:'visible',timeout:15000})
              const body=await page.locator('body').innerText()
              if(body.includes('registrada no CRM como novo lead comercial'))throw new Error('/anuncie still claims CRM Lead routing.')
              console.log('PAGES_ANUNCIE_CANONICAL_FORM=PASS')
            })
            await visit('#/app/site/midia-kit','20-media-kit.png',async()=>{
              await page.getByText('Mídia Kit',{exact:true}).first().waitFor({state:'visible',timeout:15000})
              await page.getByTestId('media-kit-live-preview').waitFor({state:'visible',timeout:15000})
              const automatic=page.getByTestId('media-kit-automatic-metrics')
              await automatic.waitFor({state:'visible',timeout:15000})
              for(const forbidden of ['Adicionar métrica','Metric key','Account ID','Property ID'])if(await automatic.getByText(forbidden,{exact:true}).count())throw new Error(`Media Kit still requires technical manual metric input: ${forbidden}`)
              const instagramFollowers=automatic.locator('[data-media-kit-metric="Instagram:followers"]')
              await instagramFollowers.waitFor({state:'visible',timeout:15000})
              mediaKitEditorFollowers=(await instagramFollowers.getByLabel('Valor').inputValue()).trim()
              const provider=(await instagramFollowers.getByLabel('Provider').inputValue()).trim()
              const account=(await instagramFollowers.getByLabel('Conta').inputValue()).trim()
              const updated=(await instagramFollowers.getByLabel('Atualizado em').inputValue()).trim()
              const status=(await instagramFollowers.getByLabel('Status').inputValue()).trim()
              const metricsValue=normalizedMetricNumber(metricsInstagramFollowers)
              const mediaKitValue=normalizedMetricNumber(mediaKitEditorFollowers)
              if(provider!=='Instagram'||!account)throw new Error(`Pages provenance mismatch: ${provider}/${account}`)
              if(!updated||updated==='Data indisponível'||!status)throw new Error('Pages automatic metric freshness/status missing')
              if(metricsValue===null||mediaKitValue===null||metricsValue!==mediaKitValue)throw new Error(`Pages Metrics / Media Kit mismatch: ${metricsInstagramFollowers} != ${mediaKitEditorFollowers}`)
              console.log(`PAGES_CANONICAL_PROVIDER=${provider}`)
              console.log(`PAGES_CANONICAL_ACCOUNT=${account}`)
              console.log('PAGES_CANONICAL_METRIC=followers')
              console.log(`PAGES_METRICS_VALUE=${metricsInstagramFollowers}`)
              console.log(`PAGES_MEDIA_KIT_VALUE=${mediaKitEditorFollowers}`)
              console.log('PAGES_METRICS_MEDIA_KIT_PARITY=PASS')
              console.log('PAGES_MEDIA_KIT_AUTOMATIC_METRICS=PASS')
            })
            await visit('#/app/site/midia-kit/preview','21-media-kit-preview.png',async()=>{
              await page.getByLabel('Preview do Mídia Kit',{exact:true}).waitFor({state:'visible',timeout:15000})
              await page.getByText('NOSSA AUDIÊNCIA',{exact:true}).waitFor({state:'visible',timeout:15000})
              const instagramFollowers=page.locator('.mk-preview-shell .mk-metric-grid article').filter({hasText:'Seguidores'}).filter({hasText:'Instagram'})
              await instagramFollowers.waitFor({state:'attached',timeout:15000})
              const previewValue=(await instagramFollowers.locator('strong').innerText()).trim()
              if(previewValue!==mediaKitEditorFollowers)throw new Error(`Pages Media Kit editor/preview mismatch: ${mediaKitEditorFollowers} != ${previewValue}`)
              console.log('PAGES_MEDIA_KIT_EDITOR_PREVIEW_PARITY=PASS')
            })
            if(pageErrors.length)throw new Error(`Browser page errors: ${pageErrors.join(' | ')}`)
            console.log(`DEVELOPMENT_DEPLOY_URL ${base}`)
            console.log('PROJECT_WIDE_PAGES_SMOKE=PASS')
          }finally{await browser.close()}
          NODE
      - name: Upload deployed browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-deploy-browser-evidence
          path: apps/web/test-results/deployed
          if-no-files-found: warn
