name: Frontend CI

on:
  push:
    branches: [dev]
  workflow_dispatch:

# dev is the canonical development branch. Publishing GitHub Pages from a push
# to dev is intentionally disabled so development commits cannot deploy a site.
permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install monorepo
        run: npm ci
      - name: Lint web
        run: npm run lint
      - name: Architecture boundaries
        run: npm run check:architecture
      - name: Typecheck web
        run: npm run typecheck
      - name: Unit tests web
        run: npm test
      - name: Validate API syntax
        run: npm --workspace @portallander/api run build
      - name: Unit tests API
        run: npm --workspace @portallander/api test

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install monorepo
        run: npm ci
      - name: Production build without demo data
        run: npm run build

  visual-audit:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install monorepo
        run: npm ci
      - name: Build explicit browser demo fixture
        env:
          VITE_ENABLE_DEMO_DATA: 'true'
        run: npm run build
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm --workspace @portallander/web run preview -- --host 127.0.0.1 > /tmp/portal-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/portallander/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portal-preview.log
          exit 1
      - name: Visual regression audit
        run: npm --workspace @portallander/web run test:visual
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-visual-audit
          path: apps/web/test-results/visual
          if-no-files-found: warn
