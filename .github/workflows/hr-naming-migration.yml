name: Canonical HR Naming Migration

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/hr-naming-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal_lander
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d portal_lander"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://portal:portal@127.0.0.1:5432/portal_lander
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rename HR technical paths and identifiers
        shell: bash
        run: |
          set -euo pipefail
          git mv apps/web/src/modules/rh apps/web/src/modules/hr
          git mv apps/web/src/modules/hr/RHPage.tsx apps/web/src/modules/hr/HRPage.tsx
          git mv apps/web/src/modules/hr/rh.css apps/web/src/modules/hr/hr.css
          git mv apps/web/src/modules/hr/rh.test.ts apps/web/src/modules/hr/hr.test.ts
          git mv apps/api/src/rhService.js apps/api/src/hrService.js
          git mv apps/api/src/rhHttp.js apps/api/src/hrHttp.js
          git mv apps/web/scripts/check-rh-boundaries.mjs apps/web/scripts/check-hr-boundaries.mjs
          git mv .github/workflows/rh-runtime.yml .github/workflows/hr-runtime.yml

          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs'
          import {execFileSync} from 'node:child_process'
          const files=execFileSync('git',['ls-files'],{encoding:'utf8'}).trim().split('\n').filter(Boolean)
          const textual=/\.(?:ts|tsx|js|mjs|json|md|yml|yaml|css)$/
          for(const path of files){
            if(!textual.test(path))continue
            if(path.startsWith('apps/api/migrations/'))continue
            let before=readFileSync(path,'utf8'),after=before
            after=after
              .replaceAll('src/modules/rh','src/modules/hr')
              .replaceAll('modules/rh','modules/hr')
              .replaceAll('RHPage','HRPage')
              .replaceAll("'./rh.css'","'./hr.css'")
              .replaceAll('check-rh-boundaries','check-hr-boundaries')
              .replaceAll('rhService','hrService')
              .replaceAll('rhAdminClient','hrAdminClient')
              .replaceAll('useRhState','useHrState')
              .replaceAll('useDeleteRhDocument','useDeleteHrDocument')
              .replaceAll('RhSeed','HrSeed')
              .replaceAll('/api/rh','/api/hr')
              .replaceAll('RH_INTERNAL_ERROR','HR_INTERNAL_ERROR')
              .replaceAll('rh_admin_state','hr_admin_state')
              .replaceAll('rh-runtime','hr-runtime')
            if(path.startsWith('apps/web/src/modules/hr/')) after=after.replaceAll('rh-','hr-')
            if(after!==before)writeFileSync(path,after)
          }
          NODE

          cat > apps/web/src/modules/hr/domain.ts <<'EOF'
          export type EmployeeStatus='active'|'inactive'|'vacation'|'leave'|'terminated'
          export type ContractType='clt'|'contractor'|'intern'|'temporary'|'self_employed'
          export type PayrollStatus='pending'|'processed'|'paid'|'cancelled'
          export type LeaveStatus='pending'|'approved'|'rejected'|'in_progress'|'completed'

          export interface Employee{
           id:string;name:string;email:string;cpf:string;rg:string;birthDate:string;phone:string;address:string;role:string;department:string;contractType:ContractType;admissionDate:string;baseSalary:number;status:EmployeeStatus;linkedUser:string;notes:string;createdAt:string;updatedAt:string
          }
          export interface PayrollEntry{
           id:string;employeeId:string;referenceMonth:string;grossSalary:number;discounts:number;bonus:number;netSalary:number;paymentDate:string;status:PayrollStatus;notes:string;createdAt:string;updatedAt:string
          }
          export interface LeaveEntry{
           id:string;employeeId:string;type:string;startDate:string;endDate:string;days:number;status:LeaveStatus;approvedBy:string;approvedByUserId?:string|null;approvedByDisplayName?:string;approvedAt?:string|null;notes:string;createdAt:string;updatedAt:string
          }
          export interface EmployeeDocument{
           id:string;employeeId:string;type:string;fileName:string;fileUrl:string;description:string;createdAt:string
          }
          export interface HrSeed{employees:Employee[];payroll:PayrollEntry[];leaves:LeaveEntry[];documents:EmployeeDocument[];departments:string[];documentTypes:string[];leaveTypes:string[];runtime?:{documentUpload?:{configured:boolean}};meta?:{version:number;updatedAt:string}}

          export const employeeStatusLabels:Record<EmployeeStatus,string>={active:'Ativo',inactive:'Inativo',vacation:'Férias',leave:'Afastado',terminated:'Desligado'}
          export const contractTypeLabels:Record<ContractType,string>={clt:'CLT',contractor:'PJ',intern:'Estágio',temporary:'Temporário',self_employed:'Autônomo'}
          export const payrollStatusLabels:Record<PayrollStatus,string>={pending:'Pendente',processed:'Processado',paid:'Pago',cancelled:'Cancelado'}
          export const leaveStatusLabels:Record<LeaveStatus,string>={pending:'Pendente',approved:'Aprovado',rejected:'Rejeitado',in_progress:'Em andamento',completed:'Concluído'}
          export const hrStatusLabel=(value:string)=>employeeStatusLabels[value as EmployeeStatus]??contractTypeLabels[value as ContractType]??payrollStatusLabels[value as PayrollStatus]??leaveStatusLabels[value as LeaveStatus]??value
          export const uid=(prefix:string)=>`${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,8)}`
          export const money=(value:number)=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(value)
          export const dateLabel=(value:string)=>value?new Date(`${value}T12:00:00`).toLocaleDateString('pt-BR'):'—'
          EOF

          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs'
          import {execFileSync} from 'node:child_process'
          const targets=execFileSync('git',['ls-files','apps/web/src/modules/hr','packages/mockup','apps/api/src/hrService.js'],{encoding:'utf8'}).trim().split('\n').filter(Boolean)
          const replacements=new Map([
            ["'ativo'","'active'"],["'inativo'","'inactive'"],["'férias'","'vacation'"],["'afastado'","'leave'"],["'desligado'","'terminated'"],
            ["'CLT'","'clt'"],["'PJ'","'contractor'"],["'Estágio'","'intern'"],["'Temporário'","'temporary'"],["'Autônomo'","'self_employed'"],
            ["'pendente'","'pending'"],["'processado'","'processed'"],["'pago'","'paid'"],["'cancelado'","'cancelled'"],
            ["'aprovado'","'approved'"],["'rejeitado'","'rejected'"],["'em andamento'","'in_progress'"],["'concluído'","'completed'"]
          ])
          for(const path of targets){
            let before=readFileSync(path,'utf8'),after=before
            for(const [from,to] of replacements)after=after.replaceAll(from,to)
            if(path.endsWith('/HRPage.tsx')){
              after=after
                .replace("dateLabel,money,type ContractType,type Employee,type EmployeeStatus,type LeaveEntry,type LeaveStatus,type PayrollEntry,type PayrollStatus,type HrSeed", "dateLabel,hrStatusLabel,money,type ContractType,type Employee,type EmployeeStatus,type LeaveEntry,type LeaveStatus,type PayrollEntry,type PayrollStatus,type HrSeed")
                .replace("const statusLabel=(value:string)=>value?value.charAt(0).toUpperCase()+value.slice(1):'—'", "const statusLabel=(value:string)=>value?hrStatusLabel(value):'—'")
                .replace("['active','inactive','vacation','leave','terminated'].map(x=><option key={x} value={x}>{statusLabel(x)}</option>)", "(['active','inactive','vacation','leave','terminated'] as EmployeeStatus[]).map(x=><option key={x} value={x}>{statusLabel(x)}</option>)")
                .replace("['pending','processed','paid','cancelled'].map(x=><option key={x}>{x}</option>)", "(['pending','processed','paid','cancelled'] as PayrollStatus[]).map(x=><option key={x} value={x}>{statusLabel(x)}</option>)")
                .replace("['pending','approved','rejected','in_progress','completed'].map(x=><option key={x}>{x}</option>)", "(['pending','approved','rejected','in_progress','completed'] as LeaveStatus[]).map(x=><option key={x} value={x}>{statusLabel(x)}</option>)")
                .replaceAll('{x.contractType}','{statusLabel(x.contractType)}')
            }
            if(after!==before)writeFileSync(path,after)
          }
          NODE

          cat > apps/api/migrations/031_hr_technical_naming.sql <<'EOF'
          begin;

          do $$
          begin
            if to_regclass('public.rh_admin_state') is not null and to_regclass('public.hr_admin_state') is null then
              alter table rh_admin_state rename to hr_admin_state;
            end if;
          end $$;

          update hr_admin_state
          set state = jsonb_set(
            jsonb_set(
              jsonb_set(
                state,
                '{employees}',
                coalesce((select jsonb_agg(jsonb_set(item,'{status}',to_jsonb(case item->>'status'
                  when 'ativo' then 'active' when 'inativo' then 'inactive' when 'férias' then 'vacation' when 'afastado' then 'leave' when 'desligado' then 'terminated' else item->>'status' end),false)
                  || jsonb_build_object('contractType',case item->>'contractType' when 'CLT' then 'clt' when 'PJ' then 'contractor' when 'Estágio' then 'intern' when 'Temporário' then 'temporary' when 'Autônomo' then 'self_employed' else item->>'contractType' end)) from jsonb_array_elements(coalesce(state->'employees','[]'::jsonb)) item),'[]'::jsonb),
                true
              ),
              '{payroll}',
              coalesce((select jsonb_agg(jsonb_set(item,'{status}',to_jsonb(case item->>'status' when 'pendente' then 'pending' when 'processado' then 'processed' when 'pago' then 'paid' when 'cancelado' then 'cancelled' else item->>'status' end),false)) from jsonb_array_elements(coalesce(state->'payroll','[]'::jsonb)) item),'[]'::jsonb),
              true
            ),
            '{leaves}',
            coalesce((select jsonb_agg(jsonb_set(item,'{status}',to_jsonb(case item->>'status' when 'pendente' then 'pending' when 'aprovado' then 'approved' when 'rejeitado' then 'rejected' when 'em andamento' then 'in_progress' when 'concluído' then 'completed' else item->>'status' end),false)) from jsonb_array_elements(coalesce(state->'leaves','[]'::jsonb)) item),'[]'::jsonb),
            true
          )
          where state is not null;

          comment on table hr_admin_state is 'Canonical HR administrative state. Technical identifiers and enum values are English; user-facing labels are localized by the web layer.';
          commit;
          EOF

          cat > docs/architecture/naming-conventions.md <<'EOF'
          # Naming conventions

          Portal Lander uses English for technical contracts and Brazilian Portuguese for the user experience.

          ## Technical layer
          - Source directories, modules, filenames, symbols, types, functions, variables, service names and technical API paths use English.
          - New database tables, columns, constraints, indexes and internal enum values use English.
          - `apps/web/src/modules` is the single canonical frontend domain tree. `src/features` must not exist.
          - Published migrations are immutable historical records. Naming corrections use forward migrations.
          - Brazilian legal abbreviations and provider trademarks such as CNPJ, CPF, CLT, Pix and Autentique may remain as canonical domain terms when they are not translation artifacts.

          ## Presentation layer
          - Visible product copy is pt-BR and must preserve correct accents and terminology.
          - User-facing route slugs may remain localized when they are part of the product navigation contract (for example `/app/rh`).
          - Internal values must be mapped to localized labels; raw technical enums must not be rendered directly.
          EOF

          cat > apps/web/scripts/check-naming-conventions.mjs <<'EOF'
          import {existsSync,readFileSync,readdirSync,statSync} from 'node:fs'
          import {join,relative,resolve,sep} from 'node:path'
          const root=resolve(process.cwd(),'../..')
          const forbiddenPaths=['apps/web/src/modules/rh','apps/api/src/rhService.js','apps/api/src/rhHttp.js','apps/web/scripts/check-rh-boundaries.mjs']
          const violations=[]
          for(const path of forbiddenPaths)if(existsSync(join(root,path)))violations.push(`legacy technical path: ${path}`)
          const ignored=new Set(['.git','node_modules','dist','test-results','coverage','migrations'])
          const patterns=[/\bRhSeed\b/,/\brhService\b/,/\brhAdminClient\b/,/\/api\/rh(?:\/|['"`])/]
          function walk(dir){for(const name of readdirSync(dir)){if(ignored.has(name))continue;const absolute=join(dir,name),stats=statSync(absolute);if(stats.isDirectory()){walk(absolute);continue}if(!/\.(?:[cm]?[jt]sx?|json|ya?ml)$/i.test(name))continue;const text=readFileSync(absolute,'utf8');text.split(/\r?\n/).forEach((line,index)=>{if(patterns.some(pattern=>pattern.test(line)))violations.push(`${relative(root,absolute).split(sep).join('/')}:${index+1}`)})}}
          walk(root)
          if(violations.length){console.error('Technical naming convention violations:');violations.forEach(item=>console.error(`- ${item}`));process.exit(1)}
          console.log('Naming conventions OK — technical HR contracts are English and legacy technical names are absent.')
          EOF

          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs'
          const packagePath='apps/web/package.json'
          const pkg=JSON.parse(readFileSync(packagePath,'utf8'))
          pkg.scripts['check:architecture']=pkg.scripts['check:architecture'].replace('node scripts/check-module-architecture.mjs && ','node scripts/check-module-architecture.mjs && node scripts/check-naming-conventions.mjs && ')
          writeFileSync(packagePath,JSON.stringify(pkg,null,2)+'\n')
          NODE

          # Temporary migration workflow must not survive the final tree.
          git rm .github/workflows/hr-naming-migration.yml

      - name: Install dependencies
        run: npm ci
      - name: Apply migrations
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find apps/api/migrations -maxdepth 1 -type f -name '*.sql' | sort -V); do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file" >/dev/null; done
      - name: Certify architecture and naming
        run: npm run check:architecture
      - name: Lint, typecheck and tests
        run: npm run lint && npm run typecheck && npm test
      - name: API build and tests
        run: npm --workspace @portallander/api run build && npm --workspace @portallander/api test
      - name: Production build
        env:
          VITE_ENABLE_DEMO_DATA: ''
          VITE_MOCKUP_SCENARIO: ''
        run: npm run build
      - name: Commit certified HR naming refactor
        shell: bash
        run: |
          set -euo pipefail
          rm -f apps/web/*.tsbuildinfo
          git config user.name 'landersolucoestech-maker'
          git config user.email 'landersolucoestech@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(hr): standardize technical naming in English'
          git push origin HEAD:dev
