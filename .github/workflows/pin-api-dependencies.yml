name: Pin API Dependencies

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/pin-api-dependencies.yml'

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin direct API dependencies and regenerate canonical lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'dev'
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises'
          const path='apps/api/package.json'
          const pkg=JSON.parse(await readFile(path,'utf8'))
          pkg.dependencies.busboy='1.6.0'
          pkg.dependencies.pg='8.23.0'
          await writeFile(path,JSON.stringify(pkg,null,2)+'\n')
          NODE
          npm install --package-lock-only --ignore-scripts
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {readFile} from 'node:fs/promises'
          const pkg=JSON.parse(await readFile('apps/api/package.json','utf8'))
          const lock=JSON.parse(await readFile('package-lock.json','utf8'))
          assert.equal(pkg.dependencies.busboy,'1.6.0')
          assert.equal(pkg.dependencies.pg,'8.23.0')
          assert.equal(lock.packages['apps/api'].dependencies.busboy,'1.6.0')
          assert.equal(lock.packages['apps/api'].dependencies.pg,'8.23.0')
          assert.equal(lock.packages['node_modules/busboy'].version,'1.6.0')
          assert.equal(lock.packages['node_modules/pg'].version,'8.23.0')
          NODE
          npm ci --ignore-scripts
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'DEPENDENCIES_ALREADY_PINNED=PASS'
            exit 0
          fi
          git commit -m 'build(api): pin runtime dependencies'
          git push origin HEAD:dev
