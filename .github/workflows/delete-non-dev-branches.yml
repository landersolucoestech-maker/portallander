name: Delete Non-Dev Branches

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  delete-non-dev-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete forbidden branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in __ignore__ stop technical-english-contract-refactor tmp-english-contract-refactor; do
            code=$(curl -sS -o /tmp/delete-response.json -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/${branch}")
            if [ "$code" != "204" ] && [ "$code" != "422" ]; then
              cat /tmp/delete-response.json
              echo "Failed to delete ${branch}: HTTP ${code}" >&2
              exit 1
            fi
            echo "Deleted or already absent: ${branch}"
          done

          branches=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/branches?per_page=100" \
            | jq -r '.[].name')
          printf '%s\n' "$branches"
          test "$branches" = "dev"
