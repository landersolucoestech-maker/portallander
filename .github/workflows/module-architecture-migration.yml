name: Canonical Module Architecture Migration

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/module-architecture-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrate feature paths to modules
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs'
          import {execFileSync} from 'node:child_process'
          import {extname} from 'node:path'

          const allowedExtensions=new Set(['.ts','.tsx','.js','.mjs','.json','.md','.yml','.yaml','.css','.html'])
          const excluded=new Set([
            'apps/web/eslint.config.js',
            'apps/web/scripts/check-module-architecture.mjs',
            '.github/workflows/module-architecture-migration.yml',
          ])
          const paths=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean)
          let changed=0
          for(const path of paths){
            if(path.startsWith('apps/web/src/features/'))continue
            if(excluded.has(path)||!allowedExtensions.has(extname(path)))continue
            const before=readFileSync(path,'utf8')
            const after=before.replaceAll('features/','modules/')
            if(after!==before){writeFileSync(path,after);changed+=1}
          }
          console.log(`Updated ${changed} tracked text files with canonical module paths.`)
          NODE

          git rm -r apps/web/src/features

          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs'
          const path='apps/web/eslint.config.js'
          const before=readFileSync(path,'utf8')
          const after=before.replace("['dist', 'src/features/**', 'src/modules/operations/ContractsPage.tsx']","['dist', 'src/modules/operations/ContractsPage.tsx']")
          if(after===before)throw new Error('Expected transitional features ignore was not found in eslint config.')
          writeFileSync(path,after)
          NODE

          cat > apps/web/scripts/check-module-architecture.mjs <<'EOF'
          import {existsSync,readFileSync,readdirSync,statSync} from 'node:fs'
          import {join,relative,resolve,sep} from 'node:path'

          const repositoryRoot=resolve(process.cwd(),'../..')
          const ignoredDirectories=new Set(['.git','node_modules','dist','test-results','coverage'])
          const textExtensions=/\.(?:[cm]?[jt]sx?|json|md|ya?ml|css|html)$/i
          const legacySegment=['fea','tures'].join('')
          const legacyRoot=join(repositoryRoot,'apps','web','src',legacySegment)
          const violations=[]
          const legacyPathPattern=new RegExp(`(?:^|[/'\"\x60])${legacySegment}/`)
          const srcLegacyPathPattern=new RegExp(`src/${legacySegment}`)

          if(existsSync(legacyRoot)){
            console.error('Legacy domain directory still exists. Domain code must live under apps/web/src/modules.')
            process.exit(1)
          }

          function walk(directory){
            for(const name of readdirSync(directory)){
              if(ignoredDirectories.has(name))continue
              const absolute=join(directory,name)
              const stats=statSync(absolute)
              if(stats.isDirectory()){walk(absolute);continue}
              if(!textExtensions.test(name))continue
              const content=readFileSync(absolute,'utf8')
              const lines=content.split(/\r?\n/)
              lines.forEach((line,index)=>{
                if(legacyPathPattern.test(line)||srcLegacyPathPattern.test(line)){
                  violations.push(`${relative(repositoryRoot,absolute).split(sep).join('/')}:${index+1}: ${line.trim()}`)
                }
              })
            }
          }

          walk(repositoryRoot)
          if(violations.length){
            console.error('Legacy module-path references remain.')
            for(const violation of violations)console.error(`- ${violation}`)
            process.exit(1)
          }
          console.log('Module architecture OK — apps/web/src/modules is the single canonical domain tree.')
          EOF

          git rm .github/workflows/module-architecture-migration.yml

      - name: Install dependencies
        run: npm ci
      - name: Certify architecture
        run: npm run check:architecture
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: API syntax and unit tests
        run: npm --workspace @portallander/api run build && npm --workspace @portallander/api test
      - name: Production build
        env:
          VITE_ENABLE_DEMO_DATA: ''
          VITE_MOCKUP_SCENARIO: ''
        run: npm run build
      - name: Commit canonical module architecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'landersolucoestech-maker'
          git config user.email 'landersolucoestech@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(web): replace feature tree with domain modules'
          git push origin HEAD:dev
