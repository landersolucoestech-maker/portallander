name: Public Source English Refactor

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/public-source-english-refactor.yml'

permissions:
  contents: write

jobs:
  refactor-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal_lander
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d portal_lander"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://portal:portal@127.0.0.1:5432/portal_lander

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rename public source paths and technical identifiers
        shell: bash
        run: |
          set -euo pipefail

          git mv apps/web/src/pages/anuncie apps/web/src/pages/advertise
          git mv apps/web/src/pages/advertise/AnunciePage.tsx apps/web/src/pages/advertise/AdvertisePage.tsx
          git mv apps/web/src/pages/colabore apps/web/src/pages/collaborate
          git mv apps/web/src/pages/collaborate/ColaborePage.tsx apps/web/src/pages/collaborate/CollaboratePage.tsx
          git mv apps/web/src/pages/collaborate/styles/colabore-current.css apps/web/src/pages/collaborate/styles/collaborate-current.css
          git mv apps/web/src/pages/contato apps/web/src/pages/contact
          git mv apps/web/src/pages/contact/ContatoPage.tsx apps/web/src/pages/contact/ContactPage.tsx
          git mv apps/web/src/pages/sobre apps/web/src/pages/about
          git mv apps/web/src/pages/about/SobrePage.tsx apps/web/src/pages/about/AboutPage.tsx

          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs'
          import {execFileSync} from 'node:child_process'
          const files=execFileSync('git',['ls-files'],{encoding:'utf8'}).trim().split('\n').filter(Boolean)
          const replacements=[
            ['pages/anuncie/AnunciePage','pages/advertise/AdvertisePage'],
            ['pages/colabore/ColaborePage','pages/collaborate/CollaboratePage'],
            ['pages/contato/ContatoPage','pages/contact/ContactPage'],
            ['pages/sobre/SobrePage','pages/about/AboutPage'],
            ['AnunciePage','AdvertisePage'],
            ['ColaborePage','CollaboratePage'],
            ['ContatoPage','ContactPage'],
            ['SobrePage','AboutPage'],
            ['LazyAnunciePage','LazyAdvertisePage'],
            ['LazyColaborePage','LazyCollaboratePage'],
            ['LazyContatoPage','LazyContactPage'],
            ['LazySobrePage','LazyAboutPage'],
            ['installRhMarketingTableSorting','installHrMarketingTableSorting'],
            ['.rh-page .rh-table','.hr-page .hr-table'],
            ['colabore-page','collaborate-page'],
            ['colabore-guidelines','collaborate-guidelines'],
            ['colabore-guideline','collaborate-guideline'],
            ['colabore-layout','collaborate-layout'],
            ['contato-page','contact-page'],
            ['sobre-page','about-page'],
            ['anuncie-contact-title','advertise-contact-title'],
            ["'colabore-hero'","'collaborate-hero'"],
            ["'colabore-diretrizes'","'collaborate-guidelines'"],
            ["'colabore-formulario'","'collaborate-form'"],
            ["'contato-hero'","'contact-hero'"],
            ["'contato-canais'","'contact-channels'"],
            ["'sobre-hero'","'about-hero'"],
            ["'sobre-conteudo'","'about-content'"]
          ]
          for(const path of files){
            if(path.startsWith('apps/api/migrations/'))continue
            if(path.startsWith('.github/workflows/'))continue
            if(!/\.(?:[cm]?[jt]sx?|css|json|md)$/i.test(path))continue
            let before=readFileSync(path,'utf8'),after=before
            for(const [from,to] of replacements)after=after.replaceAll(from,to)
            if(path.endsWith('main.tsx')){
              after=after
                .replace('API editorial indisponível; nenhuma fonte real foi substituída por mock.','Editorial API unavailable; no real data source was replaced by mock data.')
                .replace('API de formulários indisponível; nenhuma definição mock foi promovida a produção.','Forms API unavailable; no mock definition was promoted to production.')
            }
            if(path.endsWith('publicSpecialPageRegistry.tsx')){
              after=after.replace('Página especial sem renderer público:','Special public page has no renderer:')
            }
            if(path.endsWith('tableSortEnhancer.ts')){
              after=after.replaceAll('const brDate=','const brazilianDate=').replaceAll('if(brDate)','if(brazilianDate)').replaceAll('brDate[','brazilianDate[')
            }
            writeFileSync(path,after)
          }
          NODE

          cat > apps/api/migrations/032_public_section_technical_naming.sql <<'SQL'
          begin;

          insert into editorial_section_configurations(page_key,section_slug,configuration,created_at,updated_at)
          select page_key,
                 case section_slug
                   when 'colabore-hero' then 'collaborate-hero'
                   when 'colabore-diretrizes' then 'collaborate-guidelines'
                   when 'colabore-formulario' then 'collaborate-form'
                   when 'contato-hero' then 'contact-hero'
                   when 'contato-canais' then 'contact-channels'
                   when 'sobre-hero' then 'about-hero'
                   when 'sobre-conteudo' then 'about-content'
                   else section_slug
                 end,
                 configuration,created_at,updated_at
          from editorial_section_configurations
          where section_slug in ('colabore-hero','colabore-diretrizes','colabore-formulario','contato-hero','contato-canais','sobre-hero','sobre-conteudo')
          on conflict(page_key,section_slug) do update
          set configuration=excluded.configuration,
              updated_at=greatest(editorial_section_configurations.updated_at,excluded.updated_at);

          delete from editorial_section_configurations
          where section_slug in ('colabore-hero','colabore-diretrizes','colabore-formulario','contato-hero','contato-canais','sobre-hero','sobre-conteudo');

          commit;
          SQL

          cat > apps/web/scripts/check-naming-conventions.mjs <<'EOF'
          import {existsSync,readFileSync,readdirSync,statSync} from 'node:fs'
          import {join,relative,resolve,sep} from 'node:path'

          const root=resolve(process.cwd(),'../..')
          const forbiddenPaths=[
            'apps/web/src/modules/rh',
            'apps/api/src/rhService.js',
            'apps/api/src/rhHttp.js',
            'apps/web/scripts/check-rh-boundaries.mjs',
            'apps/web/src/pages/anuncie',
            'apps/web/src/pages/colabore',
            'apps/web/src/pages/contato',
            'apps/web/src/pages/sobre',
            'apps/api/scripts/verify-rh-runtime.mjs',
          ]
          const violations=[]
          for(const path of forbiddenPaths)if(existsSync(join(root,path)))violations.push(`Legacy technical path: ${path}`)

          const ignored=new Set(['.git','node_modules','dist','test-results','coverage','migrations','.github'])
          const patterns=[
            /\bRhSeed\b/,/\brhService\b/,/\brhHttp\b/,/\bhandleRhRequest\b/,/\brhAdminClient\b/,/\bRhAdminClientError\b/,/\brhRepository\b/,/\buseRh(?:Runtime|State)\b/,/\binstallRhMarketingTableSorting\b/,
            /\b(?:Anuncie|Colabore|Contato|Sobre)Page\b/,
            /\.rh-page\b/,/\.rh-table\b/,
            /\/api\/rh(?:\/|['"`])/
          ]
          function walk(dir){
            for(const name of readdirSync(dir)){
              if(ignored.has(name)||name==='check-naming-conventions.mjs')continue
              const absolute=join(dir,name),stats=statSync(absolute)
              if(stats.isDirectory()){walk(absolute);continue}
              if(!/\.(?:[cm]?[jt]sx?|json|ya?ml|css)$/i.test(name))continue
              const text=readFileSync(absolute,'utf8')
              text.split(/\r?\n/).forEach((line,index)=>{if(patterns.some(pattern=>pattern.test(line)))violations.push(`${relative(root,absolute).split(sep).join('/')}:${index+1}`)})
            }
          }
          walk(root)
          if(violations.length){console.error('Technical English naming violations:');violations.forEach(item=>console.error(`- ${item}`));process.exit(1)}
          console.log('Technical English naming gate passed.')
          EOF

          rm -f .github/workflows/public-source-english-refactor.yml

      - name: Install dependencies
        run: npm ci

      - name: Prepare storage compatibility fixture
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists storage;
          create table if not exists storage.buckets(
            id text primary key,
            name text not null,
            public boolean not null default false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          SQL

      - name: Apply all migrations
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find apps/api/migrations -maxdepth 1 -type f -name '*.sql' | sort -V); do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
          test "$(psql "$DATABASE_URL" -Atqc "select count(*) from editorial_section_configurations where section_slug in ('colabore-hero','colabore-diretrizes','colabore-formulario','contato-hero','contato-canais','sobre-hero','sobre-conteudo')")" = "0"

      - name: Certify architecture
        run: npm run check:architecture

      - name: Certify frontend
        run: npm run lint && npm run typecheck && npm test

      - name: Certify API
        run: npm --workspace @portallander/api run build && npm --workspace @portallander/api test

      - name: Certify production build
        env:
          VITE_ENABLE_DEMO_DATA: ''
          VITE_MOCKUP_SCENARIO: ''
        run: npm run build

      - name: Commit certified public source refactor
        shell: bash
        run: |
          set -euo pipefail
          rm -f apps/web/*.tsbuildinfo
          git config user.name 'landersolucoestech-maker'
          git config user.email 'landersolucoestech@gmail.com'
          git add -A ':!.github/workflows'
          git diff --cached --check
          git diff --cached --name-status
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"
          git commit -m 'refactor(web): use English public source names'
          git push origin HEAD:dev
