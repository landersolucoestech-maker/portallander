name: One-time cleanup of non-dev branches

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/cleanup-extra-branches.yml

permissions:
  contents: write

jobs:
  remove-extra-branches:
    if: github.repository == 'landersolucoestech-maker/portallander' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the five explicitly identified non-dev refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            'backup/pre-revert-2026-09-18' \
            '__do_not_use_temp' \
            'fix/ci-media-kit-marketing-template-20260914' \
            'fix/systemic-audit-2026-09-14' \
            'fix/systemic-audit-remediation'; do
            echo "Deleting refs/heads/$branch"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
          echo 'Non-dev branch cleanup complete.'
