name: One-shot architecture diagnostic

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-shot-architecture-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture architecture checks
        working-directory: apps/web
        shell: bash
        run: |
          set +e
          : > ../../ARCHITECTURE_DIAGNOSTIC.txt
          for check in check-unified-admin.mjs check-internal-boundaries.mjs check-data-boundaries.mjs check-ui-system.mjs check-site-module.mjs; do
            echo "===== $check =====" | tee -a ../../ARCHITECTURE_DIAGNOSTIC.txt
            node "scripts/$check" 2>&1 | tee -a ../../ARCHITECTURE_DIAGNOSTIC.txt
            echo "exit=${PIPESTATUS[0]}" | tee -a ../../ARCHITECTURE_DIAGNOSTIC.txt
          done
          exit 0
      - name: Commit diagnostic and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-architecture-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCHITECTURE_DIAGNOSTIC.txt .github/workflows/one-shot-architecture-diagnostic.yml
          git commit -m "chore(ci): record architecture diagnostics"
          git push origin HEAD:dev
