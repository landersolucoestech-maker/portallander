name: Frontend CI and Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify canonical dev ref
        run: |
          test "${GITHUB_REF_NAME}" = "dev"
          test "$(git branch --show-current)" = "dev"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install monorepo
        run: npm ci
      - name: Lint web
        run: npm run lint
      - name: Architecture boundaries
        run: npm run check:architecture
      - name: Typecheck web
        run: npm run typecheck
      - name: Unit tests web
        run: npm test
      - name: Validate API syntax
        run: npm --workspace @portallander/api run build
      - name: Unit tests API
        run: npm --workspace @portallander/api test

  build:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install monorepo
        run: npm ci
      - name: Production build without demo data
        env:
          VITE_ENABLE_DEMO_DATA: ''
          VITE_MOCKUP_SCENARIO: ''
        run: npm run build
      - name: Prove production mockup runtime references are zero
        run: |
          if grep -R -E "@portallander/mockup|mockup/full|mockup:source:|mockup:candidate:|generatedRuntimeData|mockCurrentUserId" apps/web/dist >/tmp/mockup-production-hits.txt; then
            cat /tmp/mockup-production-hits.txt
            echo "PRODUCTION MOCKUP REFERENCES != 0"
            exit 1
          fi
          echo "PRODUCTION MOCKUP REFERENCES = 0"
          echo "PRODUCTION MOCK DATA FALLBACK = 0"
      - name: Build Pages development demo
        env:
          VITE_ENABLE_DEMO_DATA: 'true'
          VITE_MOCKUP_SCENARIO: 'full'
        run: npm run build
      - name: Prove full mockup is present in development artifact
        run: |
          grep -R "mockup:source:mbw" apps/web/dist >/dev/null
          grep -R "content_mock_009" apps/web/dist >/dev/null
          grep -R "mockup:analytics:instagram:followers" apps/web/dist >/dev/null
          grep -R "mockup:account:instagram:portal-lander" apps/web/dist >/dev/null
          echo "DEVELOPMENT MOCKUP SCENARIO = full"
          echo "FULL MOCKUP LOADED = YES"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  visual-audit:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install monorepo
        run: npm ci
      - name: Build explicit browser demo fixture
        env:
          VITE_ENABLE_DEMO_DATA: 'true'
          VITE_MOCKUP_SCENARIO: 'full'
        run: npm run build
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm --workspace @portallander/web run preview -- --host 127.0.0.1 > /tmp/portal-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/portallander/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portal-preview.log
          exit 1
      - name: Visual regression audit
        run: npm --workspace @portallander/web run test:visual
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-visual-audit
          path: apps/web/test-results/visual
          if-no-files-found: warn

  deploy:
    if: github.ref_name == 'dev'
    environment:
      name: pages-dev
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deployed-browser-smoke:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    needs: deploy
    env:
      DEPLOY_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install monorepo
        run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Verify every published admin module in Chromium
        working-directory: apps/web
        run: |
          mkdir -p test-results/deployed
          node --input-type=module <<'NODE'
          import {chromium} from '@playwright/test'

          const base=process.env.DEPLOY_URL
          const deployedSha=process.env.GITHUB_SHA
          if(!base)throw new Error('DEPLOY_URL was not provided by deploy-pages.')
          if(!deployedSha)throw new Error('GITHUB_SHA was not provided by Actions.')

          const browser=await chromium.launch({headless:true})
          const page=await browser.newPage({viewport:{width:1440,height:1000}})
          const pageErrors=[]
          page.on('pageerror',error=>pageErrors.push(error.message))

          const canonicalRoutes=[
            ['/app/dashboard','Dashboard'],
            ['/app/crm','CRM'],
            ['/app/contracts','Contratos'],
            ['/app/finance','Financeiro'],
            ['/app/finance/invoices','Notas Fiscais'],
            ['/app/finance/accounting','Contabilidade'],
            ['/app/agenda','Agenda'],
            ['/app/chat','Chat'],
            ['/app/hr','RH'],
            ['/app/metrics','Métricas'],
            ['/app/editorial','Editorial'],
            ['/app/editorial/content','Conteúdos editoriais'],
            ['/app/site/content','Conteúdos'],
            ['/app/site/media','Mídias'],
            ['/app/site/pages','Páginas'],
            ['/app/site/forms','Formulários'],
            ['/app/site/media-kit','Mídia Kit'],
            ['/app/marketing','Visão Geral'],
            ['/app/reports','Relatórios'],
            ['/app/settings','Configurações'],
          ]

          const screenshotName=route=>route.replace(/^\/app\/?/,'').replaceAll('/','-')||'app'
          async function assertRoute(route,label){
            const url=`${base}?sha=${deployedSha}#${route}`
            const response=await page.goto(url,{waitUntil:'domcontentloaded'})
            if(response&&!response.ok())throw new Error(`HTTP ${response.status()} for ${url}`)
            await page.waitForFunction(expected=>window.location.hash.startsWith(`#${expected}`),route,{timeout:15000})
            await page.locator('main').first().waitFor({state:'visible',timeout:15000})
            const body=(await page.locator('body').innerText()).replace(/\s+/g,' ').trim()
            if(body.includes('Dados operacionais indisponíveis.'))throw new Error(`${route} rendered fail-closed public runtime in Pages demo.`)
            if(!body.includes(label))throw new Error(`${route} rendered but did not expose expected module label: ${label}`)
            if(windowHashIsFallback(await page.evaluate(()=>window.location.hash),route))throw new Error(`${route} fell through to another admin route.`)
            await page.screenshot({path:`test-results/deployed/${screenshotName(route)}.png`,fullPage:true})
            console.log(`PAGES_MODULE_PASS ${route} :: ${label}`)
          }
          function windowHashIsFallback(hash,route){
            return !hash.startsWith(`#${route}`)||hash.startsWith('#/app/login')
          }

          try{
            const publicResponse=await page.goto(`${base}?sha=${deployedSha}`,{waitUntil:'domcontentloaded'})
            if(publicResponse&&!publicResponse.ok())throw new Error(`HTTP ${publicResponse.status()} for public Pages URL`)
            await page.locator('main').first().waitFor({state:'visible',timeout:15000})
            if((await page.locator('body').innerText()).includes('Dados operacionais indisponíveis.'))throw new Error('Development Pages rendered production fail-closed screen.')

            await page.goto(`${base}?sha=${deployedSha}#/app/login`,{waitUntil:'domcontentloaded'})
            await page.waitForURL(/#\/app\/dashboard/,{timeout:15000})

            for(const [route,label] of canonicalRoutes)await assertRoute(route,label)

            const nav=page.getByRole('navigation',{name:'Módulos da Administração'})
            await nav.waitFor({state:'visible',timeout:15000})
            const navText=(await nav.innerText()).replace(/\s+/g,' ')
            for(const label of ['Dashboard','CRM','Contratos','Financeiro','Agenda','Chat','RH','Métricas','Editorial','Site','Marketing','Relatórios','Configurações']){
              if(!navText.includes(label))throw new Error(`Admin navigation does not expose implemented module: ${label}`)
            }

            if(pageErrors.length)throw new Error(`Browser page errors: ${pageErrors.join(' | ')}`)
            console.log(`DEVELOPMENT_DEPLOY_URL ${base}`)
            console.log(`PAGES_DEPLOY_SHA ${deployedSha}`)
            console.log('ALL_IMPLEMENTED_ADMIN_MODULES_RENDER=PASS')
          }finally{
            await browser.close()
          }
          NODE
      - name: Upload deployed browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-deploy-browser-evidence
          path: apps/web/test-results/deployed
          if-no-files-found: warn
