<!doctype html>
<html lang="pt-BR" class="pl-fonts-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="description" content="Portal Lander — conteúdo, música, cultura e mídia." />
    <title>Portal Lander</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="portal-font-stylesheet" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&display=block" />

    <script>
      if (location.hash === '#/noticias' || location.hash.startsWith('#/noticias?')) {
        document.documentElement.classList.add('pl-news-prepaint')
      }

      ;(() => {
        const root = document.documentElement
        const requiredFonts = [
          '400 16px "Bebas Neue"',
          '400 16px "Montserrat"',
          '500 16px "Montserrat"',
          '600 16px "Montserrat"',
          '700 16px "Montserrat"',
          '800 16px "Montserrat"',
        ]

        const reveal = () => {
          root.classList.remove('pl-fonts-loading')
          root.classList.add('pl-fonts-ready')
        }

        const waitForFonts = async () => {
          try {
            if (!document.fonts || !document.fonts.load) {
              reveal()
              return
            }
            await Promise.all(requiredFonts.map(font => document.fonts.load(font)))
            await document.fonts.ready
            reveal()
          } catch {
            reveal()
          }
        }

        const stylesheet = document.getElementById('portal-font-stylesheet')
        if (stylesheet) stylesheet.addEventListener('load', waitForFonts, { once: true })
        else waitForFonts()
      })()
    </script>

    <style>
      html.pl-fonts-loading body {
        visibility: hidden !important;
      }
      html.pl-fonts-ready body {
        visibility: visible;
      }
      html.pl-news-prepaint .public-page:not(.news-reference-page) .pl-listing-layout,
      html.pl-news-prepaint .public-page:not(.news-reference-page) .pl-pagination {
        visibility: hidden !important;
      }
      .news-reference-page .pl-page-hero {
        min-height: 300px !important;
        padding: 34px 0 34px !important;
        background-size: cover !important;
        background-position: center right !important;
        background-repeat: no-repeat !important;
      }
      .news-reference-page .pl-page-hero .public-shell {
        position: relative;
        z-index: 2;
      }
      .news-reference-page .pl-page-hero h1 {
        margin-top: 56px !important;
      }
      @media (max-width: 980px) {
        .news-reference-page .pl-page-hero {
          min-height: 260px !important;
          background-position: 62% center !important;
        }
      }
      @media (max-width: 600px) {
        .news-reference-page .pl-page-hero {
          min-height: 235px !important;
          background-position: 64% center !important;
        }
        .news-reference-page .pl-page-hero h1 {
          margin-top: 34px !important;
        }
      }
    </style>
    <noscript><style>body{visibility:visible!important}</style></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
