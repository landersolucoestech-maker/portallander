name: Force Pages Revert Deployment

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/force-pages-revert.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: force-pages-revert
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify canonical dev ref
        run: |
          test "${GITHUB_REF_NAME}" = "dev"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install monorepo
        run: npm ci
      - name: Build reverted Pages artifact
        env:
          VITE_ENABLE_DEMO_DATA: 'true'
          VITE_MOCKUP_SCENARIO: 'full'
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    if: github.ref_name == 'dev'
    environment:
      name: pages-dev
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy reverted state to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
