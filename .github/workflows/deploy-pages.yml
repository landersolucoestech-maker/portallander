name: Frontend CI and Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install monorepo
        run: npm install
      - name: Lint web
        run: npm run lint
      - name: Architecture boundaries
        run: npm run check:architecture
      - name: Typecheck web
        run: npm run typecheck
      - name: Unit tests web
        run: npm test
      - name: Validate API syntax
        run: npm --workspace @portallander/api run build
      - name: Unit tests API
        run: npm --workspace @portallander/api test

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install monorepo
        run: npm install
      - name: Build web
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  visual-audit:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install monorepo
        run: npm install
      - name: Build web
        run: npm run build
      - name: Install Chromium for visual audit
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm --workspace @portallander/web run preview -- --host 127.0.0.1 > /tmp/portallander-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/portallander/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portallander-preview.log
          exit 1
      - name: Visual viewport audit
        timeout-minutes: 15
        run: npm --workspace @portallander/web run test:visual
      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: apps/web/test-results/visual
          if-no-files-found: warn

  deploy:
    environment:
      name: pages-dev
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
