name: Metrics Global Runtime Proof

on:
  workflow_run:
    workflows: ["Frontend CI and Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  metrics-pages-runtime:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_URL: https://landersolucoestech-maker.github.io/portallander/
    steps:
      - name: Checkout exact deployed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Verify exact dev SHA
        run: |
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          echo "METRICS_RUNTIME_SHA=${TARGET_SHA}"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install monorepo
        run: npm ci
      - name: Prove reusable Metrics UI has no demo KPI literals
        run: |
          if grep -E "128400|35400|176900|548200|48200|268000|415000" apps/web/src/modules/analytics/MetricsPage.tsx; then
            echo "REUSABLE RUNTIME HARDCODED METRICS IN UI != 0"
            exit 1
          fi
          if grep -F "O período é compartilhado entre todas as fontes." apps/web/src/modules/analytics/MetricsPage.tsx; then
            echo "METRICS_PERIOD_HELPER_TEXT_PRESENT=YES"
            exit 1
          fi
          grep -q "const INTERNAL_METRICS_RANGE:MetricsRange='30d'" apps/web/src/modules/analytics/MetricsPage.tsx
          echo "REUSABLE RUNTIME HARDCODED METRICS IN UI = 0"
          echo "METRICS_INTERNAL_CANONICAL_PERIOD=30d"
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Validate published Metrics module, canonical parity and capture evidence
        working-directory: apps/web
        run: |
          mkdir -p test-results/metrics-pages
          node --input-type=module <<'NODE'
          import {chromium} from '@playwright/test'
          const base=process.env.DEPLOY_URL
          const browser=await chromium.launch({headless:true})
          const page=await browser.newPage({viewport:{width:1440,height:1100}})
          const errors=[]
          page.on('pageerror',error=>errors.push(error.message))
          const waitStable=async()=>{await page.locator('main').first().waitFor({state:'visible',timeout:20000})}
          const goto=async hash=>{
            const response=await page.goto(`${base}${hash}`,{waitUntil:'domcontentloaded'})
            if(response&&!response.ok())throw new Error(`HTTP ${response.status()} for ${hash}`)
            await waitStable()
          }
          const screenshot=async name=>page.screenshot({path:`test-results/metrics-pages/${name}`,fullPage:true})
          const normalizedNumber=value=>{
            const raw=String(value??'').trim().toLowerCase().replace(/\s+/g,' ')
            if(!raw||raw.includes('indisponível')||raw.includes('carregando'))return null
            const multiplier=raw.includes('mil')?1_000:raw.includes('mi')?1_000_000:1
            const numeric=raw.replace(/mil|mi/g,'').replace(/r\$/g,'').replace(/%/g,'').trim()
            const canonical=multiplier===1?numeric.replace(/\./g,'').replace(',','.'):numeric.replace(/\./g,'').replace(',','.')
            const parsed=Number(canonical)
            return Number.isFinite(parsed)?parsed*multiplier:null
          }
          const sourceFollower=async(testId,provider)=>{
            const source=page.getByTestId(testId)
            await source.waitFor({state:'visible',timeout:20000})
            if(await source.locator('.marketing-metrics-period').count())throw new Error(`${provider} still renders residual period UI.`)
            await source.getByText(`Resumo · ${provider}`,{exact:true}).waitFor({state:'visible',timeout:20000})
            const card=source.locator('.marketing-metric-strip article').filter({hasText:'Seguidores'}).first()
            await card.waitFor({state:'visible',timeout:20000})
            const display=(await card.locator('strong').innerText()).trim()
            if(normalizedNumber(display)===null)throw new Error(`${provider} followers is not populated in development full: ${display}`)
            const body=await source.innerText()
            for(const forbidden of ['Metric key','Account ID','Property ID','Adicionar métrica'])if(body.includes(forbidden))throw new Error(`Campo técnico manual vazou para ${provider}: ${forbidden}`)
            return display
          }
          try{
            await goto('#/app/metricas')
            const metricsPage=page.getByTestId('metrics-page')
            await metricsPage.waitFor({state:'visible',timeout:20000})
            const metricsLink=page.getByRole('link',{name:'Métricas',exact:true})
            await metricsLink.waitFor({state:'visible'})
            if((await metricsLink.getAttribute('href'))!=='#/app/metricas')throw new Error('Métricas não está exposta como item principal canônico.')
            const tablist=page.getByRole('tablist',{name:'Fontes de Métricas'})
            const tabs=tablist.getByRole('tab')
            if(await tabs.count()!==5)throw new Error(`Metrics tab count ${(await tabs.count())} != 5`)
            const labels=(await tabs.allInnerTexts()).map(value=>value.trim())
            const expected=['Visão Geral','Site','Instagram','TikTok','YouTube']
            if(JSON.stringify(labels)!==JSON.stringify(expected))throw new Error(`Unexpected Metrics tabs: ${JSON.stringify(labels)}`)
            for(const legacy of ['Redes Sociais','Conteúdo','Conversões'])if(await tablist.getByRole('tab',{name:legacy,exact:true}).count())throw new Error(`Legacy Metrics tab still present: ${legacy}`)
            const marketingGroup=page.getByRole('button',{name:/Marketing/}).first()
            await marketingGroup.click()
            const sidebar=page.locator('aside.sidebar')
            if(await sidebar.locator('.sidebar-subnav-link').filter({hasText:'Métricas'}).count())throw new Error('Marketing ainda possui submenu Métricas.')
            await page.getByTestId('metrics-overview-tab').waitFor({state:'visible',timeout:20000})
            if(await page.getByLabel('Período global das métricas').count())throw new Error('Global Metrics still renders the manual period selector.')
            if(await metricsPage.getByText('O período é compartilhado entre todas as fontes.',{exact:true}).count())throw new Error('Global Metrics still renders the period helper text.')
            if(await metricsPage.locator('.marketing-metrics-period').count())throw new Error('Global Metrics still renders period UI or residual period spacing.')
            await screenshot('metrics-overview.png')
            console.log('METRICS_TOP_LEVEL_NAV=PASS')
            console.log('METRICS_OVERVIEW=PASS')
            console.log('METRICS_PERIOD_SELECTOR_ABSENT=PASS')
            console.log('METRICS_MANUAL_PERIOD_CONTROL=ABSENT')

            await page.getByRole('tab',{name:'Site',exact:true}).click()
            const site=page.getByTestId('metrics-site-tab')
            await site.waitFor({state:'visible',timeout:20000})
            const siteBody=await site.innerText()
            for(const label of ['Usuários','Novos usuários','Usuários recorrentes','Sessões','Visualizações','Views / usuário','Taxa de engajamento','Tempo médio','Canais de aquisição','Páginas mais acessadas','Conteúdos mais acessados'])if(!siteBody.includes(label))throw new Error(`Métrica Site ausente: ${label}`)
            const content=page.getByTestId('metrics-site-content')
            const conversions=page.getByTestId('metrics-site-conversions')
            await content.waitFor({state:'visible',timeout:20000})
            await conversions.waitFor({state:'visible',timeout:20000})
            const contentBody=await content.innerText()
            const conversionBody=await conversions.innerText()
            for(const label of ['Publicados','Rascunhos','Arquivados','Top Conteúdos'])if(!contentBody.includes(label))throw new Error(`Editorial metric missing inside Site: ${label}`)
            for(const label of ['Contato Comercial','Colabore','Anuncie','CRM','content_collaborations'])if(!conversionBody.includes(label))throw new Error(`Conversion pipeline missing inside Site: ${label}`)
            await screenshot('metrics-site.png')
            console.log('METRICS_SITE_FULL=PASS')
            console.log('METRICS_CONTENT_INSIDE_SITE=PASS')
            console.log('METRICS_CONVERSIONS_INSIDE_SITE=PASS')

            await page.getByRole('tab',{name:'Instagram',exact:true}).click()
            const metricsInstagramFollowers=await sourceFollower('metrics-instagram-tab','Instagram')
            await screenshot('metrics-instagram.png')
            console.log('METRICS_INSTAGRAM_AUTOMATIC=PASS')

            await page.getByRole('tab',{name:'TikTok',exact:true}).click()
            await sourceFollower('metrics-tiktok-tab','TikTok')
            await screenshot('metrics-tiktok.png')
            console.log('METRICS_TIKTOK_AUTOMATIC=PASS')

            await page.getByRole('tab',{name:'YouTube',exact:true}).click()
            await sourceFollower('metrics-youtube-tab','YouTube')
            await screenshot('metrics-youtube.png')
            console.log('METRICS_YOUTUBE_AUTOMATIC=PASS')

            await page.getByRole('tab',{name:'Visão Geral',exact:true}).click()
            await page.getByTestId('metrics-overview-tab').waitFor({state:'visible',timeout:20000})
            console.log('METRICS_INTERNAL_CANONICAL_PERIOD=30d')
            console.log('METRICS_SHARED_PERIOD=PASS')

            await goto('#/app/marketing/metricas?tab=instagram')
            await page.waitForURL(/#\/app\/metricas\?tab=instagram$/,{timeout:10000})
            await page.getByTestId('metrics-instagram-tab').waitFor({state:'visible',timeout:20000})
            console.log('METRICS_LEGACY_REDIRECT=PASS')

            await goto('#/app/metricas?tab=banana')
            const overview=page.getByRole('tab',{name:'Visão Geral',exact:true})
            await overview.waitFor({state:'visible',timeout:20000})
            if((await overview.getAttribute('aria-selected'))!=='true')throw new Error('Invalid Metrics tab did not fall back to Visão Geral.')
            console.log('METRICS_INVALID_TAB_FALLBACK=PASS')

            await goto('#/app/site/midia-kit')
            const automatic=page.getByTestId('media-kit-automatic-metrics')
            await automatic.waitFor({state:'visible',timeout:20000})
            const canonical=automatic.locator('[data-media-kit-metric="Instagram:followers"]')
            await canonical.waitFor({state:'visible',timeout:20000})
            const mediaKitFollowers=(await canonical.getByLabel('Valor').inputValue()).trim()
            const provider=(await canonical.getByLabel('Provider').inputValue()).trim()
            const account=(await canonical.getByLabel('Conta').inputValue()).trim()
            const updated=(await canonical.getByLabel('Atualizado em').inputValue()).trim()
            const status=(await canonical.getByLabel('Status').inputValue()).trim()
            const metricsValue=normalizedNumber(metricsInstagramFollowers)
            const mediaKitValue=normalizedNumber(mediaKitFollowers)
            if(provider!=='Instagram')throw new Error(`Canonical provider mismatch: ${provider}`)
            if(!account)throw new Error('Canonical account is missing from Media Kit provenance.')
            if(!updated||updated==='Data indisponível'||!status)throw new Error('Canonical freshness/provenance is incomplete.')
            if(metricsValue===null||mediaKitValue===null||metricsValue!==mediaKitValue)throw new Error(`Metrics / Media Kit follower mismatch: ${metricsInstagramFollowers} != ${mediaKitFollowers}`)
            console.log(`CANONICAL_PROVIDER=${provider}`)
            console.log(`CANONICAL_ACCOUNT=${account}`)
            console.log('CANONICAL_METRIC=followers')
            console.log(`METRICS_MODULE_VALUE=${metricsInstagramFollowers}`)
            console.log(`MEDIA_KIT_VALUE=${mediaKitFollowers}`)
            console.log('METRICS_MEDIA_KIT_CANONICAL_METRIC_PARITY=PASS')

            console.log('METRICS_SINGLE_PAGE=PASS')
            if(errors.length)throw new Error(`Page errors: ${JSON.stringify(errors)}`)
          }finally{await browser.close()}
          NODE
      - name: Upload Metrics Pages evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-pages-${{ env.TARGET_SHA }}
          path: apps/web/test-results/metrics-pages
          if-no-files-found: error
