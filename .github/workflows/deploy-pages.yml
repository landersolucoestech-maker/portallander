name: Frontend CI and Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install monorepo
        run: npm ci
      - name: Lint web
        run: npm run lint
      - name: Architecture boundaries
        run: npm run check:architecture
      - name: Typecheck web
        run: npm run typecheck
      - name: Unit tests web
        run: npm test
      - name: Validate API syntax
        run: npm --workspace @portallander/api run build
      - name: Unit tests API
        run: npm --workspace @portallander/api test

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install monorepo
        run: npm ci
      - name: Production build without demo data
        env:
          VITE_ENABLE_DEMO_DATA: ''
          VITE_MOCKUP_SCENARIO: ''
        run: npm run build
      - name: Prove production mockup runtime references are zero
        run: |
          if grep -R -E "mockup/full|mockup:source:|mockup:candidate:" apps/web/dist >/tmp/mockup-production-hits.txt; then
            cat /tmp/mockup-production-hits.txt
            echo "PRODUCTION MOCKUP REFERENCES != 0"
            exit 1
          fi
          echo "PRODUCTION MOCKUP REFERENCES = 0"
      - name: Build Pages development demo
        env:
          VITE_ENABLE_DEMO_DATA: 'true'
          VITE_MOCKUP_SCENARIO: 'full'
        run: npm run build
      - name: Prove full mockup is present in development artifact
        run: |
          grep -R "mockup:source:mbw" apps/web/dist >/dev/null
          echo "DEVELOPMENT MOCKUP SCENARIO = full"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  visual-audit:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install monorepo
        run: npm ci
      - name: Build explicit browser demo fixture
        env:
          VITE_ENABLE_DEMO_DATA: 'true'
          VITE_MOCKUP_SCENARIO: 'full'
        run: npm run build
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm --workspace @portallander/web run preview -- --host 127.0.0.1 > /tmp/portal-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/portallander/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portal-preview.log
          exit 1
      - name: Visual regression audit
        run: npm --workspace @portallander/web run test:visual
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-visual-audit
          path: apps/web/test-results/visual
          if-no-files-found: warn

  deploy:
    environment:
      name: pages-dev
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deployed-browser-smoke:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      DEPLOY_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install monorepo
        run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Validate published development URL in Chromium
        working-directory: apps/web
        run: |
          mkdir -p test-results/deployed
          node --input-type=module <<'NODE'
          import {chromium} from '@playwright/test'

          const base=process.env.DEPLOY_URL
          if(!base)throw new Error('DEPLOY_URL was not provided by deploy-pages.')
          const browser=await chromium.launch({headless:true})
          const page=await browser.newPage({viewport:{width:1440,height:1000}})
          const pageErrors=[]
          page.on('pageerror',error=>pageErrors.push(error.message))

          async function visit(hash,fileName,verify){
            const url=`${base}${hash}`
            const response=await page.goto(url,{waitUntil:'domcontentloaded'})
            if(response && !response.ok())throw new Error(`HTTP ${response.status()} for ${url}`)
            if(response)console.log(`DEPLOY_HTTP ${response.status()} ${url}`)
            else console.log(`DEPLOY_HTTP SAME_DOCUMENT ${url}`)
            try{
              await verify()
              await page.screenshot({path:`test-results/deployed/${fileName}`,fullPage:true})
              console.log(`DEPLOY_BROWSER_PASS ${url}`)
            }catch(error){
              const body=(await page.locator('body').innerText()).slice(0,5000)
              console.log(`DEPLOY_BODY ${JSON.stringify(body)}`)
              await page.screenshot({path:`test-results/deployed/diagnostic-${fileName}`,fullPage:true})
              throw error
            }
          }

          try{
            await visit('','01-development-home.png',async()=>{
              await page.locator('main[aria-label="Seções da Página Inicial"]').waitFor({state:'visible',timeout:15000})
              await page.getByRole('region',{name:'Em Destaque'}).waitFor({state:'visible',timeout:15000})
              const body=await page.locator('body').innerText()
              if(body.includes('Dados operacionais indisponíveis.'))throw new Error('Development Pages rendered the production fail-closed screen.')
            })
            await visit('#/app/login','02-development-dashboard.png',async()=>{
              await page.waitForURL(/#\/app\/dashboard/, {timeout:15000})
              await page.getByText('Dashboard',{exact:true}).first().waitFor({state:'visible',timeout:15000})
            })
            await visit('#/app/marketing/metricas','09-marketing-metrics-restored.png',async()=>{
              await page.getByText('Visão Geral',{exact:true}).first().waitFor({state:'visible',timeout:15000})
              for(const label of ['Alcance','Impressões','Cliques','Engajamento','Conversões','Seguidores'])await page.getByText(label,{exact:true}).first().waitFor({state:'visible',timeout:15000})
              await page.getByText('Top Conteúdos',{exact:true}).waitFor({state:'visible',timeout:15000})
              const body=await page.locator('body').innerText()
              if(body.includes('Métricas indisponíveis'))throw new Error('Original Metrics module did not receive development data.')
            })
            await visit('#/app/settings','11-integrations-with-mockup-data.png',async()=>{
              await page.getByRole('tab',{name:'Integrações',exact:true}).click()
              await page.getByRole('heading',{name:'Descoberta editorial',exact:true}).waitFor({state:'visible',timeout:15000})
              const body=await page.locator('body').innerText()
              for(const source of ['Music Business Worldwide','Billboard','Billboard Brasil','GDELT','YouTube','ECAD','Pro-Música Brasil','UBC','ABRAMUS','IFPI'])if(!body.includes(source))throw new Error(`Mockup source not visible: ${source}`)
              if(body.includes('Falha HTTP 404'))throw new Error('Editorial integrations still depend on unavailable Pages API.')
            })
            await visit('#/app/site/conteudos','14-candidates.png',async()=>{
              await page.getByText('Candidatos editoriais',{exact:false}).first().waitFor({state:'visible',timeout:15000})
              await page.getByText('Candidate A',{exact:false}).first().waitFor({state:'visible',timeout:15000})
              await page.getByText('Candidate B',{exact:false}).first().waitFor({state:'visible',timeout:15000})
            })
            await visit('#/app/site/midia-kit','18-media-kit.png',async()=>{
              await page.getByText('Mídia Kit',{exact:true}).first().waitFor({state:'visible',timeout:15000})
              await page.getByText('Alcance',{exact:true}).first().waitFor({state:'visible',timeout:15000})
            })
            await visit('#/app/site/midia-kit/preview','19-media-kit-preview.png',async()=>{
              await page.getByLabel('Preview do Mídia Kit').waitFor({state:'visible',timeout:15000})
              await page.getByText('NOSSA AUDIÊNCIA',{exact:true}).waitFor({state:'visible',timeout:15000})
            })
            if(pageErrors.length)throw new Error(`Browser page errors: ${pageErrors.join(' | ')}`)
            console.log(`DEVELOPMENT_DEPLOY_URL ${base}`)
          }finally{await browser.close()}
          NODE
      - name: Upload deployed browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-deploy-browser-evidence
          path: apps/web/test-results/deployed
          if-no-files-found: warn
