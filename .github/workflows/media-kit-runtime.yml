name: Media Kit Preview and PDF Runtime

on:
  push:
    branches: [dev]
    paths:
      - 'apps/web/**'
      - '.github/workflows/media-kit-runtime.yml'
      - 'package-lock.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-pdf-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify dev execution head
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git branch --show-current)" = "dev"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --short)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install reproducibly
        run: npm ci
      - name: Build explicit browser fixture
        env:
          VITE_ENABLE_DEMO_DATA: 'true'
        run: npm run build
      - name: Install Chromium and PDF utilities
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          command -v pdfinfo >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          command -v pdftotext >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          command -v pdftoppm >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Start production preview server
        run: |
          npm --workspace @portallander/web run preview -- --host 127.0.0.1 > /tmp/media-kit-preview-server.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:4173/portallander/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/media-kit-preview-server.log
          exit 1
      - name: Validate Editor Live Preview, Full Preview and shared-renderer PDF
        working-directory: apps/web
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from '@playwright/test'
          import {mkdir,stat,writeFile} from 'node:fs/promises'
          const browser=await chromium.launch({headless:true})
          const failedRequests=[]
          const consoleErrors=[]
          const pageErrors=[]
          try{
            const context=await browser.newContext({viewport:{width:1440,height:1200}})
            const page=await context.newPage()
            page.on('console',msg=>{if(msg.type()==='error')consoleErrors.push(msg.text())})
            page.on('pageerror',error=>pageErrors.push(error?.stack||error?.message||String(error)))
            page.on('requestfailed',request=>failedRequests.push({url:request.url().replace(/([?&](?:token|access_token|refresh_token|client_secret|authorization)=)[^&]+/gi,'$1[REDACTED]'),reason:request.failure()?.errorText||'unknown'}))
            await mkdir('test-results/media-kit',{recursive:true})

            await page.goto('http://127.0.0.1:4173/portallander/#/app/site/midia-kit',{waitUntil:'domcontentloaded'})
            const previewAction=page.getByRole('button',{name:'Preview completo',exact:true})
            try{
              await previewAction.waitFor({state:'visible',timeout:15000})
              const livePreview=page.getByTestId('media-kit-live-preview')
              await livePreview.waitFor({state:'visible',timeout:15000})
              const liveDocument=livePreview.locator('.mk-document')
              if(await liveDocument.count()!==1)throw new Error('Live preview must render exactly one MediaKitDocument')
              if(await livePreview.locator('[data-media-kit-page]').count()!==1)throw new Error('Live preview must render one selected page at a time')
              if(await livePreview.locator('[data-media-kit-page="1"]').count()!==1)throw new Error('Live preview must start on page 1')
              const titleInput=page.getByLabel('Título do documento')
              const originalTitle=await titleInput.inputValue()
              const liveTitle='PORTAL LANDER LIVE PREVIEW PROOF'
              await titleInput.fill(liveTitle)
              await livePreview.locator('[data-media-kit-page="1"] h1').filter({hasText:liveTitle}).waitFor({state:'visible'})
              if(await page.getByText('Rascunho salvo',{exact:true}).count())throw new Error('Live preview update unexpectedly required save')
              await titleInput.fill(originalTitle)
              const pageSelect=livePreview.getByLabel('Página do Mídia Kit')
              await pageSelect.selectOption('9')
              if(await livePreview.locator('[data-media-kit-page="9"]').count()!==1)throw new Error('Live preview page navigation failed')
              await pageSelect.selectOption('1')
              const zoomOutput=livePreview.getByLabel('Zoom do preview')
              const initialZoom=await zoomOutput.textContent()
              await livePreview.getByRole('button',{name:'Aumentar zoom',exact:true}).click()
              if(await zoomOutput.textContent()===initialZoom)throw new Error('Live preview zoom did not update')
              await livePreview.getByRole('button',{name:'Fit',exact:true}).click()
              await page.screenshot({path:'test-results/media-kit/editor-live-preview.png',fullPage:true})
              console.log('MEDIA_KIT_LIVE_PREVIEW=PASS')
              console.log('MEDIA_KIT_LIVE_SHARED_RENDERER=PASS')
            }catch(error){
              console.log('EDITOR_URL='+page.url())
              console.log('EDITOR_HASH='+await page.evaluate(()=>location.hash))
              console.log('EDITOR_HTML_CLASS='+await page.evaluate(()=>document.documentElement.className))
              console.log('EDITOR_ROOT='+((await page.locator('#root').innerHTML()).replace(/\s+/g,' ').slice(0,3000)))
              console.log('EDITOR_BODY='+((await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,2000)))
              console.log('EDITOR_CONSOLE_ERRORS='+JSON.stringify(consoleErrors))
              console.log('EDITOR_PAGE_ERRORS='+JSON.stringify(pageErrors))
              console.log('EDITOR_FAILED_REQUESTS='+JSON.stringify(failedRequests))
              await page.screenshot({path:'test-results/media-kit/editor-failure.png',fullPage:true})
              throw error
            }
            console.log('MEDIA_KIT_EDITOR=PASS')
            console.log('MEDIA_KIT_FULL_PREVIEW_ACTION=PASS')

            await previewAction.focus()
            if(await previewAction.evaluate(node=>document.activeElement!==node))throw new Error('Full preview action cannot receive keyboard focus')
            await page.keyboard.press('Enter')
            await page.waitForURL(/#\/app\/site\/midia-kit\/preview$/,{timeout:10000})
            console.log('MEDIA_KIT_PREVIEW_KEYBOARD_OPEN=PASS')

            try{
              await page.locator('[data-media-kit-page="1"]').waitFor({state:'attached',timeout:15000})
            }catch(error){
              console.log('PREVIEW_URL='+page.url())
              console.log('PREVIEW_HASH='+await page.evaluate(()=>location.hash))
              console.log('PREVIEW_HTML_CLASS='+await page.evaluate(()=>document.documentElement.className))
              console.log('PREVIEW_ROOT='+((await page.locator('#root').innerHTML()).replace(/\s+/g,' ').slice(0,3500)))
              console.log('PREVIEW_BODY='+((await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,2500)))
              console.log('PREVIEW_CONSOLE_ERRORS='+JSON.stringify(consoleErrors))
              console.log('PREVIEW_PAGE_ERRORS='+JSON.stringify(pageErrors))
              console.log('PREVIEW_FAILED_REQUESTS='+JSON.stringify(failedRequests))
              await page.screenshot({path:'test-results/media-kit/preview-failure.png',fullPage:true})
              throw error
            }

            await page.evaluate(async()=>{
              if(!document.fonts)return
              await Promise.race([
                document.fonts.ready,
                new Promise((_,reject)=>setTimeout(()=>reject(new Error('FONT_READY_TIMEOUT')),15000)),
              ])
            })

            const pages=page.locator('[data-media-kit-page]')
            if(await pages.count()!==9)throw new Error(`Expected 9 document pages; found ${await pages.count()}`)
            const numbers=await pages.evaluateAll(nodes=>nodes.map(node=>node.getAttribute('data-media-kit-page')))
            if(JSON.stringify(numbers)!==JSON.stringify(['1','2','3','4','5','6','7','8','9']))throw new Error(`Page order invalid: ${JSON.stringify(numbers)}`)
            const pageLabels=page.locator('.mk-preview-page-label')
            if(await pageLabels.count()!==9)throw new Error('Preview page labels missing')
            const labelTexts=await pageLabels.allInnerTexts()
            if(JSON.stringify(labelTexts)!==JSON.stringify(Array.from({length:9},(_,index)=>`Página ${index+1} de 9`)))throw new Error(`Preview page labels invalid: ${JSON.stringify(labelTexts)}`)

            const backButton=page.getByRole('button',{name:'Voltar ao editor do Mídia Kit',exact:true})
            const pdfButton=page.getByRole('button',{name:'Gerar ou baixar PDF do Mídia Kit',exact:true})
            await backButton.waitFor()
            await pdfButton.waitFor()
            await backButton.focus()
            await page.keyboard.press('Tab')
            const focusedLabel=await page.evaluate(()=>document.activeElement?.getAttribute('aria-label')||document.activeElement?.textContent?.trim()||'')
            if(focusedLabel!=='Gerar ou baixar PDF do Mídia Kit')throw new Error(`Toolbar keyboard order invalid; focused=${focusedLabel}`)
            console.log('MEDIA_KIT_TOOLBAR_KEYBOARD=PASS')

            const fonts=await page.evaluate(()=>({bebas:document.fonts?.check('16px "Bebas Neue"')??false,montserrat:document.fonts?.check('16px "Montserrat"')??false,status:document.fonts?.status??'unsupported'}))
            console.log('FONTS='+JSON.stringify(fonts))
            if(!fonts.bebas||!fonts.montserrat||fonts.status!=='loaded')throw new Error('Required fonts are not loaded')

            const checkViewport=async(width,height,name)=>{
              await page.setViewportSize({width,height})
              await page.waitForTimeout(100)
              const result=await page.evaluate(()=>({viewport:innerWidth,scrollWidth:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth),frameWidth:document.querySelector('.mk-preview-page-frame')?.getBoundingClientRect().width||0,pageRect:(()=>{const rect=document.querySelector('[data-media-kit-page="1"]')?.getBoundingClientRect();return rect?{width:rect.width,height:rect.height}:null})()}))
              console.log(`VIEWPORT_${name}=`+JSON.stringify(result))
              if(result.scrollWidth>result.viewport+2)throw new Error(`${name}: global horizontal overflow`)
              if(result.frameWidth>result.viewport+2)throw new Error(`${name}: preview frame exceeds viewport`)
              if(!result.pageRect)throw new Error(`${name}: page missing`)
              const ratio=result.pageRect.width/result.pageRect.height
              if(Math.abs(ratio-(210/297))>.01)throw new Error(`${name}: A4 proportion changed (${ratio})`)
              await page.screenshot({path:`test-results/media-kit/preview-${name.toLowerCase()}.png`,fullPage:true})
            }

            await checkViewport(1440,1200,'DESKTOP')
            await checkViewport(768,1024,'TABLET')
            await checkViewport(375,812,'MOBILE')
            await page.setViewportSize({width:1440,height:1200})

            await page.emulateMedia({media:'print'})
            const printPages=await pages.evaluateAll(nodes=>nodes.map(node=>{const r=node.getBoundingClientRect();return {width:r.width,height:r.height,scrollWidth:node.scrollWidth,scrollHeight:node.scrollHeight}}))
            if(printPages.some(item=>Math.abs(item.width-793.7)>3||Math.abs(item.height-1122.5)>3))throw new Error('Printed document page is not A4')
            if(printPages.some(item=>item.scrollWidth>item.width+2||item.scrollHeight>item.height+2))throw new Error('Printed document page overflows')
            const toolbarHidden=await page.locator('.mk-preview-toolbar').evaluate(node=>getComputedStyle(node).display==='none')
            const labelsHidden=await page.locator('.mk-preview-page-label').first().evaluate(node=>getComputedStyle(node).display==='none')
            if(!toolbarHidden||!labelsHidden)throw new Error('Preview-only controls leaked into print')
            if(await page.locator('.site-media-kit-live-preview').count())throw new Error('Editor live-preview controls leaked into full preview/print surface')

            await page.screenshot({path:'test-results/media-kit/print-preview.png',fullPage:true})
            await page.pdf({path:'test-results/media-kit/media-kit.pdf',format:'A4',printBackground:true,preferCSSPageSize:true,margin:{top:'0',right:'0',bottom:'0',left:'0'}})
            const pdf=await stat('test-results/media-kit/media-kit.pdf')
            if(pdf.size<10000)throw new Error('Generated PDF is unexpectedly small')
            await writeFile('test-results/media-kit/runtime-summary.json',JSON.stringify({sha:process.env.GITHUB_SHA,editorOpened:true,livePreview:true,previewOpenedFromEditor:true,pageCount:9,pageOrder:numbers,keyboard:true,fonts,failedRequests,consoleErrors,pageErrors,pdfBytes:pdf.size},null,2))
            console.log('MEDIA_KIT_FULL_PREVIEW=PASS')
            console.log('PREVIEW_PAGE_COUNT=9')
            console.log('MEDIA_KIT_SHARED_RENDERER_PARITY=PASS')
            console.log('PDF_BYTES='+pdf.size)
            console.log('FAILED_REQUESTS='+JSON.stringify(failedRequests))
            console.log('PAGE_ERRORS='+JSON.stringify(pageErrors))
            if(consoleErrors.length)throw new Error('Console errors: '+consoleErrors.join(' | '))
            if(pageErrors.length)throw new Error('Page errors: '+pageErrors.join(' | '))
            if(failedRequests.length)throw new Error('Failed requests: '+JSON.stringify(failedRequests))
            await context.close()
          }finally{await browser.close()}
          NODE
      - name: Inspect PDF structure and searchable text
        working-directory: apps/web
        run: |
          pdfinfo test-results/media-kit/media-kit.pdf | tee test-results/media-kit/pdfinfo.txt
          pages=$(awk '/^Pages:/ {print $2}' test-results/media-kit/pdfinfo.txt)
          test "$pages" = "9"
          grep -q '594.96 x 841.92 pts (A4)' test-results/media-kit/pdfinfo.txt
          pdftotext test-results/media-kit/media-kit.pdf test-results/media-kit/media-kit.txt
          grep -q 'PORTAL LANDER' test-results/media-kit/media-kit.txt
          grep -q 'NOSSA AUDIÊNCIA' test-results/media-kit/media-kit.txt
          grep -q 'INVENTÁRIO PUBLICITÁRIO' test-results/media-kit/media-kit.txt
          echo "PDF_PAGE_COUNT=$pages"
          echo "PDF_SEARCHABLE_TEXT=PASS"
          echo "MEDIA_KIT_PDF=PASS"
      - name: Render all PDF pages
        working-directory: apps/web
        run: |
          mkdir -p test-results/media-kit/rendered
          pdftoppm -png -r 110 test-results/media-kit/media-kit.pdf test-results/media-kit/rendered/page >/dev/null 2>&1
          count=$(find test-results/media-kit/rendered -type f -name 'page-*.png' | wc -l)
          echo "RENDERED_PAGE_IMAGES=$count"
          test "$count" = "9"
      - name: Upload Preview and PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-kit-preview-pdf-runtime
          path: |
            apps/web/test-results/media-kit
            /tmp/media-kit-preview-server.log
          if-no-files-found: warn
