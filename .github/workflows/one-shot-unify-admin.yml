name: One-shot unified admin migration

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/one-shot-unify-admin.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Replace obsolete workspace navigation alias
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -rl --include='*.ts' --include='*.tsx' 'CRM_WORKSPACE_NAV' apps/web/src || true)
          if ((${#files[@]})); then
            sed -i 's/CRM_WORKSPACE_NAV/UNIFIED_ADMIN_NAV/g' "${files[@]}"
          fi
          if grep -R --include='*.ts' --include='*.tsx' -n 'CRM_WORKSPACE_NAV' apps/web/src; then
            echo 'Residual CRM_WORKSPACE_NAV found after migration.' >&2
            exit 1
          fi
          rm .github/workflows/one-shot-unify-admin.yml
      - name: Commit atomic migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src .github/workflows/one-shot-unify-admin.yml
          if git diff --cached --quiet; then
            echo 'Nothing to migrate.'
            exit 0
          fi
          git commit -m 'refactor(admin): finish unified navigation migration'
          git push origin HEAD:dev
