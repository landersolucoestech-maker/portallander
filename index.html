<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="description" content="Portal Lander — conteúdo, música, cultura e mídia." />
    <title>Portal Lander</title>
    <script>
      if (location.hash === '#/noticias' || location.hash.startsWith('#/noticias?')) {
        document.documentElement.classList.add('pl-news-prepaint')
      }
    </script>
    <style>
      html.pl-news-prepaint .public-page:not(.news-reference-page) .pl-listing-layout,
      html.pl-news-prepaint .public-page:not(.news-reference-page) .pl-pagination {
        visibility: hidden !important;
      }
      .news-reference-page .pl-page-hero {
        min-height: 300px !important;
        padding: 34px 0 34px !important;
        background-size: cover !important;
        background-position: center right !important;
        background-repeat: no-repeat !important;
      }
      .news-reference-page .pl-page-hero .public-shell {
        position: relative;
        z-index: 2;
      }
      .news-reference-page .pl-page-hero h1 {
        margin-top: 56px !important;
      }
      @media (max-width: 980px) {
        .news-reference-page .pl-page-hero {
          min-height: 260px !important;
          background-position: 62% center !important;
        }
      }
      @media (max-width: 600px) {
        .news-reference-page .pl-page-hero {
          min-height: 235px !important;
          background-position: 64% center !important;
        }
        .news-reference-page .pl-page-hero h1 {
          margin-top: 34px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
