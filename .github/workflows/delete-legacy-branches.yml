name: Delete Legacy Branches

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/delete-legacy-branches.yml'

permissions:
  contents: write

jobs:
  delete-legacy-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete explicitly authorized obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/heads"
          branches=(
            'chore/analytics-media-kit-execution'
            'chore/engineering-agentic-os-audit'
            'deploy-spotify-releases-20260903'
            'dev-spotify-fix'
          )

          for branch in "${branches[@]}"; do
            echo "DELETE_BRANCH=${branch}"
            status=$(curl -sS -o /tmp/delete-ref.json -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/${branch}")
            if [ "${status}" != '204' ]; then
              echo "DELETE_FAILED branch=${branch} http=${status}"
              cat /tmp/delete-ref.json
              exit 1
            fi
          done

          for branch in "${branches[@]}"; do
            status=$(curl -sS -o /tmp/ref-check.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/${branch}")
            if [ "${status}" != '404' ]; then
              echo "DELETE_VERIFICATION_FAILED branch=${branch} http=${status}"
              cat /tmp/ref-check.json
              exit 1
            fi
            echo "DELETED=${branch}"
          done

          echo 'OLD_BRANCHES_DELETED=PASS'
